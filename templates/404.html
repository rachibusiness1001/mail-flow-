<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — MailFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f1117;color:#e2e8f0;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
        .wrap{text-align:center;padding:40px;position:relative;z-index:1}
        .glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,0.15),transparent 70%);border-radius:50%;z-index:0}
        .code{font-family:'Syne',sans-serif;font-size:120px;font-weight:800;background:linear-gradient(135deg,#6366f1,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:16px}
        .msg{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;margin-bottom:10px;color:#e2e8f0}
        .sub{color:#64748b;font-size:15px;margin-bottom:36px;line-height:1.6}
        .btn{background:#6366f1;color:white;padding:14px 32px;border-radius:10px;text-decoration:none;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:all 0.2s}
        .btn:hover{background:#5558e8;color:white;transform:translateY(-2px);box-shadow:0 12px 30px rgba(99,102,241,0.4)}
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="wrap">
        <div class="code">404</div>
        <div class="msg">Page Not Found</div>
        <div class="sub">The page you're looking for doesn't exist<br>or has been moved.</div>
        <a href="/dashboard" class="btn">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5v-5h3v5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146z"/></svg>
            Back to Dashboard
        </a>
    </div>
</body>
</html>
